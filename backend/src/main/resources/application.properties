# --------------------------------------
# Server Configuration
# --------------------------------------
server.port=8080
spring.application.name=toms
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# --------------------------------------
# PostgreSQL Configuration
# --------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/toms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:toms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:toms@123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hikari's own default is 10 — each connection carries real memory (buffers,
# thread state) that adds up on a memory-capped host. Lower default here,
# raise via env var on a less constrained tier.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Builds the Hibernate SessionFactory on a background executor instead of
# blocking bean creation during context refresh — a call into a repository
# before it's ready just waits for it, but it stops holding up the rest of
# startup (Tomcat's port bind is the last step of context refresh).
spring.data.jpa.repositories.bootstrap-mode=deferred

# --------------------------------------
# Redis Configuration
# --------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}

# --------------------------------------
# JPA and Hibernate Configuration
# --------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------
# Logging Configuration
# --------------------------------------
# logging.level.root=INFO
# logging.level.org.springframework.web=DEBUG
# logging.file.name=logs/toms.log

# --------------------------------------
# Kafka Configuration
# --------------------------------------
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
kafka.sasl.username=${KAFKA_SASL_USERNAME:toms}
kafka.sasl.password=${KAFKA_SASL_PASSWORD:toms-secret}
kafka.ssl.ca-cert-base64=${KAFKA_SSL_CA_CERT_BASE64:}

# KafkaConfig.java defines its own KafkaAdmin @Bean (using the same kafka.* properties
# and securityProps() helper as the producer/consumer factories), which makes Boot's
# autoconfigured KafkaAdmin back off — so bootstrap-servers/security.protocol/sasl.*
# do NOT need to be duplicated here under spring.kafka.*. They previously were, and
# that copy silently drifted out of sync (hardcoded PlainLoginModule after switching
# to SCRAM) — a whole class of bug this now structurally can't happen again.

spring.kafka.consumer.group-id=toms-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.isolation.level=read_committed
# Actually controls @KafkaListener's concurrency (the old spring.kafka.consumer.concurrency
# line above never did — wrong namespace, our consumerFactory is hand-built, not
# Boot-autoconfigured). 4 listeners x this value = total consumer threads; each one
# carries real memory, so keep this low on a memory-capped host.
kafka.consumer.concurrency=${KAFKA_CONSUMER_CONCURRENCY:1}
# Auto-instrument Kafka producer/consumer spans + propagate trace context via headers
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# --------------------------------------
# JWT Configuration
# --------------------------------------
jwt.secret.key=${JWT_SECRET_KEY:NiaHyECf3zy67/pezJr+KOmStF8H41Pz5KENPzGUYfw=}

# --------------------------------------
# Mail Configuration
# --------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}

# --------------------------------------
# Actuator
# --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
# Only health-check mail when mail is actually configured (same flag as AuthController)
management.health.mail.enabled=${MAIL_ENABLED:false}
# Boot's Kafka health indicator builds its own KafkaAdmin from spring.kafka.* (unset here —
# our broker connection is configured via the custom kafka.* properties in KafkaConfig.java),
# so it defaults to a plaintext localhost:9092 client. Against a SASL-only broker this doesn't
# just fail health checks — it hammers the broker with rejected handshakes continuously,
# degrading real producer/consumer traffic. Disable until spring.kafka.* is also configured.
management.health.kafka.enabled=false
management.metrics.distribution.percentiles-histogram.matching.engine.duration=true


info.app.name=TOMS
info.app.description=Trading Order Management System

# --------------------------------------
# Kafka Security
# --------------------------------------
# Defaults to PLAINTEXT for local dev.
# Set KAFKA_SECURITY_PROTOCOL=SASL_SSL for production.
# KAFKA_SASL_MECHANISM=PLAIN
# KAFKA_SASL_USERNAME and KAFKA_SASL_PASSWORD must be set when using SASL.

# --------------------------------------
# Application Properties
# --------------------------------------
# Rate limits (per minute). Raise RATE_LIMIT_AUTH locally when running the E2E suite.
rate.limit.auth-per-minute=${RATE_LIMIT_AUTH:5}
rate.limit.orders-per-minute=${RATE_LIMIT_ORDERS:20}
order.constraints.max-quantity=100
risk.limits.max-position=500
risk.limits.max-notional=50000
risk.limits.daily-loss-limit=5000

app.base-url=${APP_BASE_URL:http://localhost:8080}